query pointsByDate($date: String!) {
  pointsByDate(date: $date) {
    id
    timestamp
  }
}

query totalMsInMonth($date: String!) {
  totalMsInMonth(date: $date) {
    milliseconds
    invalidDays
  }
}

query pointsInIntervalWithTotal($input: IntervalDateArgs!) {
  pointsInIntervalWithTotal(input: $input) {
    milliseconds
    invalidDays
    points {
      id
      timestamp
    }
  }
}
